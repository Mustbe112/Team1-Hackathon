[profile.default]
src = "src"
out = "out"
libs = ["lib"]
evm_version = "cancun"
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200

[rpc_endpoints]
fuji = "https://api.avax-test.network/ext/bc/C/rpc"

# Verification note (see plan §2 and §11):
# Foundry 1.8.3 routes `avalanche_fuji` to Etherscan V2 (chainid=43113), where a
# Snowtrace/Routescan key does NOT work. Use the first-party Builder Hub verifier:
#
#   forge script script/Deploy.s.sol --rpc-url fuji --broadcast --verify \
#     --verifier custom \
#     --verifier-url https://build.avax.network/api/verify/43113/api
#
# If you prefer Routescan instead, use an explicit url (there is no `routescan`
# --verifier value):
#
#   [etherscan]
#   fuji = { key = "${ROUTESCAN_API_KEY}", chain = 43113, url = "https://api.routescan.io/v2/network/testnet/evm/43113/etherscan" }
#
# RESOLVED 2026-09-26: the Builder Hub verifier was returning a server-side
# `internal_error` ("Could not start verification"), and `api.snowtrace.io`
# silently targets MAINNET (43114). The endpoint that worked, with no API key, is
# the Snowtrace *testnet* gateway (which fronts Etherscan V2 for 43113):
#
#   forge verify-contract <address> <src/File.sol:Name> \
#     --chain-id 43113 \
#     --verifier custom \
#     --verifier-url https://api-testnet.snowtrace.io/api \
#     --constructor-args <abi-encoded> \
#     --rpc-url fuji
#
# Routescan (`.../testnet/evm/43113/etherscan` above) also accepts keyless
# submissions. Both are keyed by address; note the stale-record caveat on
# `MockUSDC` in the root README.
